---
# Namespace (optional — deploy into your existing Argo namespace instead if preferred)
apiVersion: v1
kind: Namespace
metadata:
  name: tiphys

---
# Secret — populate before applying
# kubectl create secret generic webhook-secrets \
#   --from-literal=github-token=<PAT> \
#   --from-literal=webhook-secret=<WEBHOOK_SECRET> \
#   -n argo-webhook
#apiVersion: v1
#kind: Secret
#metadata:
#  name: webhook-secrets
#  namespace: tiphys
#type: Opaque
# data:
#   github-token: <base64>
#   webhook-secret: <base64>

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-argo-webhook
  namespace: tiphys

---
# RBAC: allow the service to create/read Workflows in the argo namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-submitter
  namespace: tiphys
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch", "create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workflowtemplates
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-argo-webhook-workflow-submitter
  namespace: tiphys
subjects:
  - kind: ServiceAccount
    name: github-argo-webhook
    namespace: tiphys
roleRef:
  kind: Role
  name: workflow-submitter
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-argo-webhook
  namespace: tiphys
  labels:
    app: tiphys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiphys
  template:
    metadata:
      labels:
        app: tiphys
    spec:
      serviceAccountName: github-argo-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-server
          image: tiphys:1.1.0  # Replace with your image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ARGO_NAMESPACE
              value: "tiphys"
            - name: PIPELINE_DIR
              value: ".argo"
            - name: LOG_LEVEL
              value: "info"
            # Optionally restrict to specific repos:
            # - name: ALLOWED_REPOS
            #   value: "myorg/repo1,myorg/repo2"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: github-token
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: webhook-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: github-argo-webhook
  namespace: tiphys
  labels:
    app: tiphys
spec:
  selector:
    app: tiphys
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP

---
# Expose via Ingress (adjust for your ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-argo-webhook
  namespace: tiphys
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod  # Uncomment for TLS
spec:
  ingressClassName: traefik
  # tls:
  #   - hosts:
  #       - webhook.your-domain.com
  #     secretName: webhook-tls
  rules:
    - host: bd2a-88-203-112-244.ngrok-free.app  # Replace with your domain
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: github-argo-webhook
                port:
                  name: http
